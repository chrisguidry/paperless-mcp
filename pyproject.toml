[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-mcp"
version = "0.1.0"
description = "Read-only MCP server for paperless-ngx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
paperless-mcp = "server:mcp.run"

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py",
    "client.py",
    "documents.py",
    "effects.py",
    "metadata.py",
    "pagination.py",
    "paperless_errors.py",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=server",
    "--cov=client",
    "--cov=documents",
    "--cov=effects",
    "--cov=metadata",
    "--cov=pagination",
    "--cov=paperless_errors",
    "--cov=tests/",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
    "--strict-markers",
    "--strict-config",
    "-Werror",
]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
env = [
    "PAPERLESS_URL=http://paperless.test",
    "PAPERLESS_TOKEN=test-token",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Shared"]
