[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "paperless-mcp"
dynamic = ["version"]
description = "Read-only MCP server for paperless-ngx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "fastmcp>=4.2.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[project.scripts]
paperless-mcp = "paperless_mcp.server:mcp.run"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "loq>=0.2.0",
    "prek>=0.5.10",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.6",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src/paperless_mcp",
    "--cov=tests/",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
    "--strict-markers",
    "--strict-config",
    "-Werror",
    # py-key-value-aio runs beartype on its own classes under pytest, and
    # beartype calls isinstance() on their AsyncKeyValue protocol, which is
    # not @runtime_checkable.  Python 3.15 deprecates that call, so beartype
    # skips those classes and warns that it did.  Only py-key-value-aio
    # brings beartype in, so the whole category is safe to ignore.
    "-Wignore::beartype.roar.BeartypeClawDecorWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
env = [
    "PAPERLESS_URL=http://paperless.test",
    "PAPERLESS_TOKEN=test-token",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Shared"]
