repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  # mypy runs from the locked environment, so it checks against the same
  # fastmcp and mcp that the tests run with, and not the newest release.
  # It runs once over every file, because parallel runs share one cache.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy server.py models.py client.py tests
        language: system
        pass_filenames: false
        files: ^(server\.py|models\.py|client\.py|tests/.+\.py)$
