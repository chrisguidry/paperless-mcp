repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
      - id: ruff-format

  # loq and pyright run from the locked environment, so pyright checks
  # against the same fastmcp and pydantic that the tests run with.
  # pyright checks the files that [tool.pyright] includes, in one run.
  - repo: local
    hooks:
      - id: loq
        name: loq (file size limits)
        entry: uv run loq
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright (modules and tests)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
